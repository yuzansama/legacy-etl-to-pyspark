name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: pyspark ${{ matrix.pyspark }} · python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pyspark: "3.5.*", python: "3.11" }   # ANSI mode off by default
          - { pyspark: "4.0.*", python: "3.12" }   # ANSI mode on by default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install "pyspark==${{ matrix.pyspark }}" -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit and end-to-end tests
        run: pytest -q
      - name: Demo run + parity against legacy output
        run: make demo
